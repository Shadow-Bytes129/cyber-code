<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои траты</title>
</head>
<body>
    <h1>Список трат</h1>

    <p><a href="/expenses/new">➕ Добавить новую трату</a></p>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Сумма</th>
                <th>Описание</th>
                <th>Дата</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            <!-- Вот этот цикл перебирает все траты из базы -->
            {{range .Expenses}}
            <tr>
                <td>{{.ID}}</td>
                <td>{{.Amount}}</td>
                <td>{{.Description}}</td>
                <td>{{.Date}}</td>
                <td>
                    <!-- Кнопка редактирования -->
                    <a href="/expenses/{{.ID}}/edit">✏️</a>
                    
                    <!-- Кнопка удаления (отправляет POST-запрос) -->
                    <form method="POST" action="/expenses/{{.ID}}/delete" style="display:inline"
                          onsubmit="return confirm('Удалить эту трату?')">
                        <button type="submit">🗑️</button>
                    </form>
                </td>
            </tr>
            {{else}}
            <tr>
                <td colspan="5">Пока трат нет. Добавьте первую!</td>
            </tr>
            {{end}}
        </tbody>
    </table>
</body>
</html>
