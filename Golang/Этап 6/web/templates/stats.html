{{define "stats_content"}}
<h1>Статистика расходов</h1>

<div style="margin-bottom: 20px;">
  <label>Выберите год: 
    <input type="number" id="yearFilter" value="2026" min="2000" max="2100" style="width: 80px;">
  </label>
  <button onclick="loadStats()">Обновить</button>
</div>

<div style="display: flex; gap: 20px; flex-wrap: wrap;">
  <div style="flex: 1; min-width: 300px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h3>По категориям</h3>
    <canvas id="categoryChart"></canvas>
  </div>
  <div style="flex: 1; min-width: 300px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h3>По месяцам</h3>
    <canvas id="monthChart"></canvas>
  </div>
</div>

<!-- Подключаем Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  let chart1 = null;
  let chart2 = null;

  function loadStats() {
    const year = document.getElementById('yearFilter').value;

    // 1. Круговая диаграмма
    fetch('/api/stats/by-category?year=' + year)
      .then(response => response.json())
      .then(data => {
        if (!data) data = [];
        const labels = data.map(item => item.name);
        const totals = data.map(item => item.total);

        if (chart1) chart1.destroy(); // Удаляем старый график перед отрисовкой нового
        chart1 = new Chart(document.getElementById('categoryChart'), {
          type: 'pie',
          data: {
            labels: labels,
            datasets: [{
              data: totals,
              backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40']
            }]
          },
          options: { responsive: true }
        });
      });

    // 2. Столбчатая диаграмма
    fetch('/api/stats/by-month?year=' + year)
      .then(response => response.json())
      .then(data => {
        if (!data) data = [];
        const labels = data.map(item => item.month);
        const totals = data.map(item => item.total);

        if (chart2) chart2.destroy();
        chart2 = new Chart(document.getElementById('monthChart'), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Сумма расходов (₽)',
              data: totals,
              backgroundColor: '#36A2EB'
            }]
          },
          options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });
      });
  }

  // Загружаем статистику при открытии страницы
  loadStats();
</script>
{{end}}
